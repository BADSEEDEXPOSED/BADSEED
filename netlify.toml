# Trinity Reliability Lockdown - Forced Rebuild Jan 12
[build]
  command = "CI=false npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Public token dashboard. Netlify keeps the canonical badseed.exposed URL while
# the independently deployed dashboard remains its source of truth.
[[redirects]]
  from = "/live"
  to = "https://badseedtoken.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/live/*"
  to = "https://badseedtoken.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/live-api/*"
  to = "https://badseedtoken.netlify.app/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/assets/*"
  to = "https://badseedtoken.netlify.app/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/live"
