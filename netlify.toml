[build.environment]
  REACT_APP_SOLANA_RPC_HOST = "https://mainnet.helius-rpc.com/?api-key=273e36fb-f6f8-4556-8166-a2299b594197"

# Keep the public token dashboard at the BADSEED domain while its scheduled
# functions and market pipeline remain isolated on the token-dashboard site.
[[redirects]]
  from = "/live"
  to = "https://badseedtoken.netlify.app/"
  status = 200
  force = true

[[redirects]]
  from = "/live/*"
  to = "https://badseedtoken.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/live-api/*"
  to = "https://badseedtoken.netlify.app/.netlify/functions/:splat"
