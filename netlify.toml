[functions.prophecy-generate]
  schedule = "0 0 * * *"

[functions.prophecy-reveal]
  schedule = "0 18 * * *"

[functions.archive-daily]
  schedule = "0 23 * * *"

[functions.cloud-queue-poller]
  schedule = "*/10 * * * *"

[functions.daily-reset]
  schedule = "0 0 * * *"



[functions.queue-processor]
  schedule = "0 0,12 * * *"

