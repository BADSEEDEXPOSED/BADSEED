name = "badseed-exposed"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[define]
__dirname = '""'
__filename = '""'

[vars]
REACT_APP_SOLANA_RPC_HOST = "https://mainnet.helius-rpc.com/?api-key=273e36fb-f6f8-4556-8166-a2299b594197"

[alias]
"@irys/sdk" = "./netlify/functions/lib/irys-shim.js"

[assets]
directory = "./build"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/live", "/live/*", "/live-api/*", "/assets/*", "/badseed.gif", "/.netlify/*"]

[[services]]
binding = "TOKEN_WORKER"
service = "badseed-token"

[triggers]
crons = ["* * * * *"]

[[routes]]
pattern = "badseed.exposed"
custom_domain = true

[[routes]]
pattern = "www.badseed.exposed"
custom_domain = true
